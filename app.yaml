runtime: custom
env: flex
service: fiap-feedback-app

service_account: sa-deploy-feedback-app@fiap-adj8-feedback-platform.iam.gserviceaccount.com

beta_settings:
  cloud_sql_instances: fiap-adj8-feedback-platform:us-central1:feedback-db-instance

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 2
  cool_down_period_sec: 60
  cpu_utilization:
    target_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

env_variables:
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_DRIVER_CLASS: ${DB_DRIVER_CLASS}
  GCP_PROJECT_ID: ${GCP_PROJECT_ID}
  GCP_SQL_INSTANCE_CONNECTION_NAME: ${GCP_SQL_INSTANCE_CONNECTION_NAME}
  GCP_SQL_DATABASE_NAME: ${GCP_SQL_DATABASE_NAME}
  GCP_PUBSUB_ENABLED: ${GCP_PUBSUB_ENABLED}
  JPA_DDL_AUTO: ${JPA_DDL_AUTO}
  JPA_SHOW_SQL: ${JPA_SHOW_SQL}
  HIBERNATE_DIALECT: ${HIBERNATE_DIALECT}
  FLYWAY_ENABLED: ${FLYWAY_ENABLED}
  FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE}
  FLYWAY_LOCATIONS: ${FLYWAY_LOCATIONS}
  SERVER_PORT: ${SERVER_PORT}


spring:
  datasource:
    url: jdbc:postgresql://google/feedback_db?cloudSqlInstance=fiap-adj8-feedback-platform:us-central1:feedback-db-instance&socketFactory=com.google.cloud.sql.postgres.SocketFactory&sslmode=disable
    username: fiap_user
    password: pass
    driver-class-name: org.postgresql.Driver

  cloud:
    gcp:
      project-id: fiap-adj8-feedback-platform
      sql:
        instance-connection-name: fiap-adj8-feedback-platform:us-central1:feedback-db-instance
        database-name: feedback_db
      pubsub:
        enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:feedback_db}
    username: ${DB_USERNAME:fiap_user}
    password: ${DB_PASSWORD:pass}
    driver-class-name: ${DB_DRIVER_CLASS:org.postgresql.Driver}

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:fiap-adj8-feedback-platform}
      sql:
        instance-connection-name: ${GCP_SQL_INSTANCE_CONNECTION_NAME:fiap-adj8-feedback-platform:us-central1:feedback-db-instance}
        database-name: ${GCP_SQL_DATABASE_NAME:feedback_db}
      pubsub:
        enabled: ${GCP_PUBSUB_ENABLED:true}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}

server:
  port: ${SERVER_PORT:8080}
